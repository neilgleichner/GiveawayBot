[project]
name = "asanpanel-giveaway-bot"
version = "0.1.0"
description = "Secure Telegram giveaway bot for AsanPanel"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.22,<4",
  "SQLAlchemy>=2.0.40,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.15,<2",
  "redis>=5.2,<7",
  "apscheduler>=3.11,<4",
  "pydantic-settings>=2.8,<3",
  "structlog>=25.2,<26",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
